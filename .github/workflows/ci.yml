name: CI

# 目标：每次 push 都跑一遍"能不能装、发的东西还对不对"的三道关 —— 语法、
# 静态检查、测试套件，外加一次对线上 Release 的签名/哈希复验。
# 测试里有几项强绑 Debian 12（内核/系统检查），所以作业跑在 debian:12 容器里，
# 而不是 ubuntu runner，否则永远是红的、然后就没人看了。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 权限按作业分配：测试作业要回写 ci-log 分支和 commit status，复验作业
# 只需要读。不给仓库级别的宽权限，原则是最小够用。
jobs:
  test:
    name: Debian 12 测试与打包
    runs-on: ubuntu-latest
    container: debian:12
    permissions:
      contents: write   # 失败时把日志推到 ci-log 分支
      statuses: write   # 失败时写一条 commit status
    # 容器作业默认用 sh(dash) 跑 run:，但那不是 bash —— 脚本里的
    # ${PIPESTATUS[0]} 之类会直接报 "bad substitution"。全局指定 bash。
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget shellcheck unzip iproute2 openssl \
            kmod procps logrotate

      - name: 语法检查（bash -n）
        run: |
          set -e
          for f in install.sh manage.sh diagnose.sh lib/*.sh tools/*.sh tests/run_tests.sh; do
            bash -n "${f}"
          done
          echo "所有脚本语法通过"

      - name: 静态检查（shellcheck，warning 级）
        # 1.4.3 起整棵树在 warning 级干净，所以不再只卡 error。
        run: |
          shellcheck -S warning install.sh manage.sh diagnose.sh lib/*.sh tools/*.sh

      - name: 测试套件
        # 1.4.3 起环境类用例在测试模式下不再要求真实 systemctl，
        # 所以 CI 不再用 SKIP_ENV_TESTS 遮蔽它们（真实 systemd 的
        # 验收仍由 smoke-remote.sh 负责）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 失败时把失败的用例名写进 commit status：这样不用登录也能
        # 从 /commits/<sha>/status 里看到具体哪几条挂了（日志要权限）。
        run: |
          set +e
          bash tests/run_tests.sh 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [[ "${rc}" -ne 0 ]]; then
            # Public Actions logs need auth; annotations are readable.
            grep -n -B2 -A8 '^FAIL' /tmp/tests.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            fails="$(grep -E '^(FAIL|Tests:)' /tmp/tests.log | tr '\n' ' ' | cut -c1-120)"
            echo "失败用例：${fails}"
            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"state\":\"failure\",\"context\":\"tests\",\"description\":\"${fails}\"}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" || true
            fi
            exit 1
          fi

      - name: 失败时把日志推到 ci-log 分支
        # 公开仓库的 Actions 日志要权限才能看；把测试日志推到一个
        # 独立分支，匿名也能读，排障不用再猜。
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-log
          cp /tmp/tests.log ci-failure.log 2>/dev/null || true
          git add -A
          git commit -m "ci failure log" || true
          git push -f origin ci-log

      - name: 打包（单文件安装器 + 校验和）
        # CI 里没有签名私钥；构建用 --no-sign，正式发布在本地签。
        run: bash tools/build-release.sh --no-sign

      - name: 上传发布物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  verify-release:
    name: 复验线上 Release 资产
    runs-on: ubuntu-latest
    container: debian:12
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates gnupg coreutils

      - name: 下载并按 SHA256SUMS 校验全部资产
        # 发布链的最后一环：拿线上 Release 的附件，用仓库公钥验签，
        # 再逐个对哈希。缺资产、被替换、清单漏项都会在这里变红，
        # 而不是等到用户装到一半才发现。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}/releases/latest"
          json="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${api}")"
          tag="$(printf '%s' "${json}" \
            | grep -oE '"tag_name"[[:space:]]*:[[:space:]]*"[^"]+"' | head -1 \
            | sed -E 's/.*"([^"]+)"$/\1/')"
          if [[ -z "${tag}" ]]; then
            echo "::error::找不到已发布的 Release"
            exit 1
          fi
          work="$(mktemp -d)"
          cd "${work}"
          base="https://github.com/${repo}/releases/download/${tag}"
          for f in SHA256SUMS SHA256SUMS.asc dsh-signing-key.asc; do
            curl -fsSL -O "${base}/${f}" || { echo "::error::缺少资产: ${f}"; exit 1; }
          done
          export GNUPGHOME="${work}/gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          gpg --batch --import dsh-signing-key.asc >/dev/null 2>&1
          fpr="$(gpg --with-colons --fingerprint 2>/dev/null | awk -F: '/^fpr:/{print $10; exit}')"
          if [[ "${fpr}" != "8E25C6FC8FA01719137FAAE6BC9AF5236E467872" ]]; then
            echo "::error::签名公钥指纹不符: ${fpr}"
            exit 1
          fi
          gpg --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null \
            | grep -q '^\[GNUPG:\] GOODSIG' || { echo "::error::SHA256SUMS 签名校验失败"; exit 1; }
          count=0
          for f in $(awk '{print $2}' SHA256SUMS); do
            curl -fsSL -O "${base}/${f}" || { echo "::error::Release 缺资产: ${f}"; exit 1; }
            count=$((count + 1))
          done
          sha256sum -c SHA256SUMS
          echo "release ${tag}: ${count} 个资产通过签名与哈希复验"
