name: CI

# 目标：每次 push 都跑一遍"能不能装"的三道关 —— 语法、静态检查、测试套件。
# 测试里有几项强绑 Debian 12（内核/系统检查），所以整条流水线跑在
# debian:12 容器里，而不是 ubuntu runner，否则永远是红的、然后就没人看了。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  test:
    name: Debian 12 测试与打包
    runs-on: ubuntu-latest
    container: debian:12
    # 容器作业默认用 sh(dash) 跑 run:，但那不是 bash —— 脚本里的
    # ${PIPESTATUS[0]} 之类会直接报 "bad substitution"。全局指定 bash。
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget shellcheck unzip iproute2 openssl \
            kmod procps logrotate

      - name: 语法检查（bash -n）
        run: |
          set -e
          for f in install.sh manage.sh diagnose.sh lib/*.sh tools/*.sh tests/run_tests.sh; do
            bash -n "${f}"
          done
          echo "所有脚本语法通过"

      - name: 静态检查（shellcheck，仅 error 级）
        run: |
          shellcheck -S error install.sh manage.sh diagnose.sh lib/*.sh tools/*.sh

      - name: 测试套件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 失败时把失败的用例名写进 commit status：这样不用登录也能
        # 从 /commits/<sha>/status 里看到具体哪几条挂了（日志要权限）。
        run: |
          set +e
          bash tests/run_tests.sh 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [[ "${rc}" -ne 0 ]]; then
            fails="$(grep -E '^(FAIL|Tests:)' /tmp/tests.log | tr '\n' ' ' | cut -c1-120)"
            echo "失败用例：${fails}"
            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"state\":\"failure\",\"context\":\"tests\",\"description\":\"${fails}\"}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" || true
            fi
            exit 1
          fi

      - name: 失败时把日志推到 ci-log 分支
        # 公开仓库的 Actions 日志要权限才能看；把测试日志推到一个
        # 独立分支，匿名也能读，排障不用再猜。
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-log
          cp /tmp/tests.log ci-failure.log 2>/dev/null || true
          git add -A
          git commit -m "ci failure log" || true
          git push -f origin ci-log

      - name: 打包（单文件安装器 + 校验和）
        run: bash tools/build-release.sh

      - name: 上传发布物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
