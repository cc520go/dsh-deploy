server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    root /srv/dsh/dist;
    index index.html;

    charset utf-8;
    autoindex on;
    autoindex_exact_size off;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
